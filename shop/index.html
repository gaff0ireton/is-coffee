<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="is Coffeeのオンラインショップ。コーヒー豆やオリジナルグッズをご紹介します。" />
  <title>ONLINE SHOP | is Coffee</title>
  <!-- TODO: 既存サイトの共通CSSとEC用CSSを読み込む -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop/style.css">
  <script type="module" src="../js/main.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">本文へスキップ</a>

  <!-- TODO: 既存サイトのヘッダーに差し替えてOK -->
  <header class="ec-header">
    <div class="ec-header__inner">
      <a class="ec-header__logo" href="../index.html" aria-label="is Coffee トップページ">is Coffee</a>
      <nav class="ec-header__nav" aria-label="メインナビゲーション">
        <ul>
          <li><a href="../index.html">CAFE</a></li>
          <li><a href="./" aria-current="page">ONLINE SHOP</a></li>
          <li><a href="../cart/">CART <span class="ec-header__cart-count" aria-label="カート内の商品数">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <nav class="ec-breadcrumb" aria-label="パンくずリスト">
      <ol>
        <li><a href="../index.html">HOME</a></li>
        <li aria-current="page">ONLINE SHOP</li>
      </ol>
    </nav>

    <section class="ec-shop" aria-labelledby="shop-title">
      <div class="ec-shop__heading">
        <p class="ec-shop__eyebrow">OUR PRODUCTS</p>
        <h1 id="shop-title" class="ec-shop__title">ONLINE SHOP</h1>
        <p class="ec-shop__lead">お店の味を、ご自宅でも。コーヒー豆と毎日に寄り添うアイテムをお届けします。</p>
      </div>

      <div class="ec-shop__toolbar">
        <!-- 絞り込みと並び替えはJS実装時に接続 -->
        <div class="ec-shop__filter">
          <label for="category-select">カテゴリー</label>
          <select id="category-select" name="category">
            <option value="all">すべて</option>
            <option value="coffee">コーヒー豆</option>
            <option value="goods">グッズ</option>
          </select>
        </div>
        <div class="ec-shop__sort">
          <label for="sort-select">並び替え</label>
          <select id="sort-select" name="sort">
            <option value="recommended">おすすめ順</option>
            <option value="price-asc">価格が安い順</option>
            <option value="price-desc">価格が高い順</option>
          </select>
        </div>
        <p class="ec-shop__count" id="product-count" aria-live="polite">4件の商品</p>
      </div>

      <div class="ec-products">
        <ul class="ec-products__list">

        </ul>
        <p class="ec-products__empty" hidden>該当する商品はありません。</p>
      </div>
    </section>
  </main>

  <!-- TODO: 既存サイトのフッターに差し替えてOK -->
  <footer class="ec-footer">
    <a href="../index.html">is Coffee</a>
    <p><small>※このオンラインショップはデモです。実際の販売は行っていません。</small></p>
  </footer>
  <!-- TODO: EC用JavaScriptを実装する場合はここで読み込む -->
</body>

</html>
